site_name: MakerVault Guide
site_description: Your workshop, organised. A practical guide to installing and using MakerVault.
site_url: https://gavrd7.github.io/MakerVault-docs/
repo_url: https://github.com/gavrd7/MakerVault-docs
repo_name: MakerVault-docs
edit_uri: edit/main/docs/guide/
docs_dir: docs/guide
site_dir: site
use_directory_urls: true
theme:
  name: material
  language: en
  logo: assets/makervault-logo.jpg
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
extra_css:
  - assets/guide.css
extra_javascript:
  - assets/guide-search.js
extra:
  generator: false
copyright: MakerVault · Guide for v1.0.5 · Stable release
nav:
  - Welcome: index.md
  - Getting started:
      - Before you begin: getting-started/before-you-begin.md
      - Install MakerVault on Linux: getting-started/install.md
      - Install on Windows (Docker Desktop / WSL2): getting-started/windows.md
      - Configure your .env file: getting-started/environment.md
      - Choose your storage: getting-started/storage.md
      - First sign-in: getting-started/first-sign-in.md
      - Guided newcomer workflow: getting-started/first-project.md
  - Using MakerVault:
      - Find your way around: using/navigation.md
      - Boards and components: using/catalogue.md
      - Physical inventory: using/inventory.md
      - Projects and bills of materials: using/projects.md
      - Files, images and versions: using/files.md
      - Printers, filament and spools: using/printing.md
      - Models and the 3D viewer: using/models.md
      - Print history and costs: using/print-history.md
      - Printed parts: using/printed-parts.md
      - Maker Tags: using/maker-tags.md
      - Interactive Wiring: using/interactive-wiring.md
  - Optional integrations:
      - Spoolman: integrations/spoolman.md
      - Creality local & CFS: integrations/creality.md
      - Bambu Lab local & AMS: integrations/bambu.md
      - PrusaLink: integrations/prusalink.md
      - Anycubic LAN & ACE: integrations/anycubic.md
      - FlashForge local: integrations/flashforge.md
      - Moonraker manufacturer profiles: integrations/moonraker-manufacturers.md
      - Printer adapter validation: integrations/printer-adapter-validation.md
      - Optional printer controls: integrations/printer-controls.md
      - Printer camera feeds: integrations/printer-cameras.md
      - SimplyPrint: integrations/simplyprint.md
  - Running your installation:
      - Accounts and storage: administration/accounts.md
      - Catalogue updates: administration/catalogue-updates.md
      - Back up and restore: administration/backup.md
      - Update MakerVault: administration/updates.md
  - Advanced features:
      - Bind mounts and permissions: advanced/storage.md
      - HTTPS and reverse proxies: advanced/reverse-proxy.md
      - OpenID Connect: advanced/oidc.md
      - Email and account recovery: advanced/email.md
      - Upgrading from before v0.7: advanced/legacy-upgrade.md
  - Reference:
      - Troubleshooting: reference/troubleshooting.md
      - Configuration: reference/configuration.md
      - Glossary: reference/glossary.md
      - About this guide: reference/about.md


